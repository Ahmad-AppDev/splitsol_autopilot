name: SplitSol autopilot
run-name: "autopilot: ${{ inputs.command || 'scheduled' }}"

on:
  schedule:
    - cron: "47 11 * * *"     # daily ~4:47 PM Pakistan time: make the next episode
    - cron: "13 3 * * 1"      # weekly: refresh Instagram token
  workflow_dispatch:
    inputs:
      command:
        description: "generate | approve | redo | discard | refresh | poll"
        type: choice
        options: [generate, approve, redo, discard, refresh, poll]
        default: generate
      kind:
        description: "What to make (generate)"
        type: choice
        options: [carousel, story]
        default: carousel
      feedback:
        description: "Note for redo (optional)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Pick command
        id: cmd
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then c="${{ inputs.command }}";
          elif [ "${{ github.event.schedule }}" = "13 3 * * 1" ]; then c=refresh;
          else c=generate; fi
          echo "c=$c" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          if [ "${{ steps.cmd.outputs.c }}" = "generate" ] || [ "${{ steps.cmd.outputs.c }}" = "redo" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi

      - name: Run
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_MODE: ${{ vars.TIKTOK_MODE || 'inbox' }}
          IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER || 'pollinations' }}
          POLLINATIONS_MODEL: ${{ vars.POLLINATIONS_MODEL || 'flux' }}
          CHARACTER_REF_URL: ${{ vars.CHARACTER_REF_URL }}
          FEEDBACK: ${{ inputs.feedback }}
          KIND: ${{ inputs.kind || vars.DAILY_KIND || 'carousel' }}
          TTS_VOICE: ${{ vars.TTS_VOICE || 'en-US-AndrewMultilingualNeural' }}
        run: python -m autopilot.main ${{ steps.cmd.outputs.c }}

      - name: Save story state
        if: always()
        run: |
          git config user.name "splitsol-autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add story/state.json
          git diff --cached --quiet || (git commit -m "state: ${{ steps.cmd.outputs.c }} [skip ci]" && git push)
